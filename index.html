<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Concrete Mix Design (ACI 211.1)</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@0.85.1/build/stlite.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@0.85.1/build/stlite.js";
      mount(
        {
          requirements: ["pandas"],
          entrypoint: "MixDesignTool.py",
          files: {
            "MixDesignTool.py": { url: "./MixDesignTool.py" }
          },
        },
        document.getElementById("root"),
      );
    </script>
  </body>
</html>
